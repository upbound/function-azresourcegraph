---
apiVersion: meta.pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-azresourcegraph
  annotations:
    meta.crossplane.io/maintainer: Upbound <support@upbound.io>
    meta.crossplane.io/source: github.com/upbound/function-azresourcegraph
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: A composition function for querying Azure Resource Graph.
    meta.crossplane.io/readme: |
      This composition function allows you to query [Azure Resource Graph](https://learn.microsoft.com/en-us/azure/governance/resource-graph/overview)
      using its query language.

      The function reads the credential named `azure-creds`; its Secret must hold the credentials JSON (for a single service principal, the same JSON as the [Official Azure Provider](https://marketplace.upbound.io/providers/upbound/provider-family-azure/latest)) under the key `credentials`.
spec: {}
